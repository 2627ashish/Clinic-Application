spring.application.name=chauhan-dental-clinic
spring.data.mongodb.uri=${MONGODB_URI}
server.port=8080
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGODB_DATABASE:clinic_db}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=chauhan-dental-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.chaula.dental.messaging.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
whatsapp.kafka.inbound-topic=${WHATSAPP_KAFKA_INBOUND_TOPIC:whatsapp-inbound}
whatsapp.kafka.outbound-topic=${WHATSAPP_KAFKA_OUTBOUND_TOPIC:whatsapp-outbound}

whatsapp.api.url=https://graph.facebook.com/v19.0
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v27.0}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.api.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.webhook.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.templates.language=${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
whatsapp.templates.appointment-pending=${WHATSAPP_TEMPLATE_PENDING:appointment_pending}
whatsapp.templates.appointment-confirmed=${WHATSAPP_TEMPLATE_CONFIRMED:appointment_confirmed}
whatsapp.templates.appointment-rescheduled=${WHATSAPP_TEMPLATE_RESCHEDULED:appointment_rescheduled}
whatsapp.templates.appointment-cancelled=${WHATSAPP_TEMPLATE_CANCELLED:appointment_cancelled}
